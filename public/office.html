<title>Right Bite Factory Improvements</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: a site ledger. Options run down the left column; a sticky running total sits on the right.
   On phones the total moves above the options and a bar pinned to the bottom keeps the grand total in view. */
:root {
  --bg: #edf0f1;          /* Asian White plane, cool zinc bias */
  --surface: #fbfcfc;
  --raise: #f3f5f6;
  --ink: #14181c;
  --ink-2: #47515a;
  --muted: #5f6a73;
  --line: #d8dee1;
  --line-2: #bcc5ca;
  --pb: #d2ab6c;          /* Bluescope "Peanut Butter" flashing colour */
  --pb-ink: #7f5417;
  --pb-soft: #f4e9d6;
  --good: #1b743a;
  --bad: #b3261e;
  --s-paid: #3b444c;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --s-cont: #aeb7bd;
  --shadow: 0 1px 0 rgba(20, 24, 28, .04), 0 8px 24px -16px rgba(20, 24, 28, .25);
  --f-display: "Chakra Petch", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1114; --surface: #161a1d; --raise: #1c2125; --ink: #e8ecef; --ink-2: #b3bcc3; --muted: #94a0a9;
    --line: #2a3137; --line-2: #3a434a; --pb: #d6b277; --pb-ink: #e3c087; --pb-soft: #2f271a;
    --good: #52c47c; --bad: #f08a80; --s-paid: #c9d1d7;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s-cont: #5b656d;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 28px -18px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1114; --surface: #161a1d; --raise: #1c2125; --ink: #e8ecef; --ink-2: #b3bcc3; --muted: #94a0a9;
  --line: #2a3137; --line-2: #3a434a; --pb: #d6b277; --pb-ink: #e3c087; --pb-soft: #2f271a;
  --good: #52c47c; --bad: #f08a80; --s-paid: #c9d1d7;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s-cont: #5b656d;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 28px -18px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pb-ink); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: .86em; letter-spacing: .01em; }
.num-t { font-variant-numeric: tabular-nums; }

.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}

/* ---------- header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; padding-bottom: 22px; border-bottom: 2px solid var(--ink); }
.top-text { min-width: 0; max-width: 720px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 5vw, 46px); line-height: 1.05; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1 .pb { color: var(--pb-ink); }
.lede { margin: 10px 0 0; color: var(--ink-2); max-width: 62ch; }
.spec { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-2); }
.spec span { white-space: nowrap; }
.top-tools { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.lang { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 13px; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.sync { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
.sync[data-s="saved"]::before { background: var(--good); }
.sync[data-s="saving"]::before, .sync[data-s="pending"]::before { background: var(--pb); }
.sync[data-s="error"]::before, .sync[data-s="readonly"]::before { background: var(--bad); }

/* ---------- year overview ---------- */
.ov { margin-top: 28px; }
.ov-stats { display: grid; grid-template-columns: minmax(0, 1.35fr) repeat(2, minmax(0, 1fr)) minmax(0, 1.25fr); gap: 1px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; box-shadow: var(--shadow); margin-bottom: 14px; }
.ov-stats > div { padding: 16px 18px; box-shadow: 0 0 0 1px var(--line); display: grid; gap: 4px; align-content: start; min-width: 0; }
.ov-stats .k { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.ov-stats .v { font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 3vw, 30px); line-height: 1.1; font-variant-numeric: tabular-nums; }
.ov-stats .big .v { font-size: clamp(30px, 4.4vw, 42px); }
.ov-stats .per { font-size: 13px; color: var(--muted); }
.ov-stats .bud { gap: 6px; }
@media (max-width: 900px) { .ov-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ov-stats .big, .ov-stats .bud { grid-column: 1 / -1; } }
.projects { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.ov-head, .prow-main { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(110px, 1fr) 128px 118px 140px; gap: 6px 16px; align-items: center; padding: 10px 14px; }
.ov-head { font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); padding-block: 8px; }
.ov-head .lg { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ov-head .r { text-align: right; }
.prow + .prow { border-top: 1px solid var(--line); }
.p-name { min-width: 0; display: grid; gap: 3px; justify-items: start; }
.p-name b { font-weight: 600; font-size: 15px; }
.p-name small { color: var(--muted); font-size: 12.5px; }
.p-name .field { font-weight: 600; }
.p-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.p-ctl select { border: 1px solid var(--line-2); border-radius: 3px; background: var(--surface); padding: 2px 6px; font-size: 12.5px; font-weight: 600; }
.p-ctl select.st-done { color: var(--good); border-color: var(--good); }
.p-ctl select.st-doing { color: var(--pb-ink); border-color: var(--pb); }
.p-ctl select.st-plan { color: var(--muted); }
.p-num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; min-width: 0; }
.p-num .k { display: none; }
.p-num input.num { width: 100%; max-width: 9em; }
.meter { display: flex; gap: 2px; height: 10px; background: var(--raise); border-radius: 4px; }
.meter span { height: 100%; }
.meter span:first-child { border-radius: 4px 0 0 4px; }
.meter span:last-child { border-radius: 0 4px 4px 0; }
.meter span:only-child { border-radius: 4px; }
.m-paid { background: var(--s-paid); }
.m-left { background: var(--pb); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 0 7px; border-radius: 3px; border: 1px solid currentColor; white-space: nowrap; line-height: 1.6; }
.chip.done { color: var(--good); }
.chip.doing { color: var(--pb-ink); }
.chip.plan { color: var(--muted); }
.linkbtn { border: 0; background: transparent; padding: 0; color: var(--pb-ink); font-weight: 600; font-size: 12.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.pdocs { padding: 0 14px 12px; }
.pdocs > summary { cursor: pointer; font-size: 13px; color: var(--pb-ink); font-weight: 600; padding: 2px 0 8px; width: max-content; max-width: 100%; }
@media (max-width: 760px) {
  .ov-head { display: none; }
  .prow-main { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; }
  .prow-main .p-name, .prow-main .meter { grid-column: 1 / -1; }
  .p-num .k { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
}
.band { margin-top: 48px; padding-bottom: 14px; border-bottom: 2px solid var(--ink); display: flex; flex-direction: column; gap: 4px; scroll-margin-top: 12px; }
.band-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.band h2 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 4vw, 34px); line-height: 1.1; margin: 0; }
.band .spec { margin-top: 4px; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 32px; margin-top: 24px; align-items: start; }
.main { min-width: 0; display: flex; flex-direction: column; gap: 40px; }
.aside { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); min-width: 0; }
@media (max-width: 1020px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .aside { position: static; order: -1; }
}

/* ---------- summary ---------- */
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.sum-total .k { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.sum-total .v { font-family: var(--f-display); font-weight: 700; font-size: clamp(32px, 6vw, 40px); line-height: 1.05; letter-spacing: -.01em; }
.sum-total .per { font-size: 13px; color: var(--muted); margin-top: 2px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--ink-2); display: flex; align-items: center; gap: 8px; min-width: 0; }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.kv .strong { font-weight: 600; color: var(--ink); }
.kv .rule { grid-column: 1 / -1; border-top: 1px solid var(--line); margin: 4px 0; }
.sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.sw.hatch { background: repeating-linear-gradient(135deg, var(--s-cont) 0 2px, transparent 2px 4px); outline: 1px solid var(--s-cont); outline-offset: -1px; }

.bar-wrap { position: relative; }
.bar { display: flex; gap: 2px; height: 16px; }
.seg { min-width: 3px; height: 100%; border: 0; padding: 0; cursor: default; }
.seg:first-child { border-radius: 4px 0 0 4px; }
.seg:last-child { border-radius: 0 4px 4px 0; }
.seg.hatch { background: repeating-linear-gradient(135deg, var(--s-cont) 0 2px, transparent 2px 4px); outline: 1px solid var(--s-cont); outline-offset: -1px; }
.tip { position: absolute; bottom: calc(100% + 8px); transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.35; padding: 6px 9px; border-radius: 3px; white-space: nowrap; pointer-events: none; z-index: 3; }
.tip b { font-weight: 600; }

.budget { display: grid; gap: 6px; }
.budget label { font-size: 13px; color: var(--ink-2); }
.budget-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.status { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 3px; border: 1px solid currentColor; }
.status.ok { color: var(--good); }
.status.no { color: var(--bad); }
.cont-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.cont-row input[type="range"] { flex: 1; accent-color: var(--pb-ink); min-width: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1.5px solid var(--ink); background: transparent; padding: 7px 12px; border-radius: 3px; cursor: pointer; font-size: 13.5px; font-weight: 600; line-height: 1.2; }
.btn:hover { background: var(--raise); }
.btn.solid { background: var(--ink); color: var(--bg); }
.btn.solid:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn.ghost { border-color: var(--line-2); font-weight: 500; }
.btn.warn { border-color: var(--bad); color: var(--bad); }
.toast { font-size: 13px; color: var(--good); min-height: 1.2em; }
.copy-fallback { width: 100%; min-height: 140px; font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line-2); border-radius: 3px; background: var(--raise); padding: 8px; }

/* ---------- sections ---------- */
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; border-bottom: 1px solid var(--line-2); padding-bottom: 8px; margin-bottom: 16px; }
.sec-h h2 { font-family: var(--f-display); font-weight: 600; font-size: 22px; margin: 0; letter-spacing: 0; text-wrap: balance; }
.sec-h .sub { color: var(--muted); font-size: 13.5px; width: 100%; order: 3; }
.sec-h .amt { font-family: var(--f-display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 14px; }

/* paid */
.paidcats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
.paidcats > div { background: var(--surface); padding: 10px 12px; box-shadow: 0 0 0 1px var(--line); }
@media (max-width: 560px) { .paidcats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.paidcats .k { font-size: 12.5px; color: var(--ink-2); }
.paidcats .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.docs { border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.doc + .doc { border-top: 1px solid var(--line); }
.doc summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 92px minmax(0, 1fr) auto 18px; gap: 4px 14px; align-items: baseline; padding: 11px 14px; }
.doc summary::-webkit-details-marker { display: none; }
.doc summary:hover { background: var(--raise); }
.doc summary::after { content: "+"; font-family: var(--f-mono); color: var(--muted); text-align: right; }
.doc[open] summary::after { content: "–"; }
.d-date { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.d-what { min-width: 0; }
.d-what b { font-weight: 600; display: block; }
.d-what small { color: var(--muted); font-size: 12.5px; }
.d-amt { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.doc-body { padding: 0 14px 14px; }
.tbl-scroll { overflow-x: auto; }
table.lines { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 520px; }
table.lines th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); padding: 6px 8px 6px 0; }
table.lines td { padding: 6px 8px 6px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
table.lines .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.lines tr.adj td { color: var(--muted); font-style: italic; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 2px; background: var(--raise); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.note { font-size: 13px; color: var(--ink-2); margin: 10px 0 0; }
.doc.mine summary .d-what small { color: var(--pb-ink); }
.del { border: 0; background: transparent; color: var(--bad); cursor: pointer; font-size: 13px; padding: 4px 6px; text-decoration: underline; text-underline-offset: 2px; }
.addpay { margin-top: 14px; display: grid; grid-template-columns: 150px minmax(0, 1fr) 170px 140px auto; gap: 8px; align-items: end; }
.addpay .lbl { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
@media (max-width: 760px) { .addpay { grid-template-columns: 1fr 1fr; } .addpay .wide { grid-column: 1 / -1; } }
@media (max-width: 560px) { .doc summary { grid-template-columns: minmax(0, 1fr) auto 14px; } .d-date { grid-column: 1 / -1; } }

/* inputs */
.field { width: 100%; border: 1px solid var(--line-2); border-radius: 3px; background: var(--surface); padding: 6px 8px; min-width: 0; }
.field:focus { border-color: var(--pb-ink); }
input.num { width: 7.2em; text-align: right; font-variant-numeric: tabular-nums; border: 0; border-bottom: 1.5px solid var(--line-2); background: transparent; padding: 2px 2px 1px; border-radius: 0; }
input.num:focus { outline: none; border-bottom-color: var(--pb-ink); background: var(--pb-soft); }
input.num.edited { border-bottom-color: var(--pb); color: var(--pb-ink); font-weight: 600; }
input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.pi { display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap; }
.pi .per { font-size: 12px; color: var(--muted); }
@media (max-width: 560px) { input.num { width: 5.6em; } }
.undo { border: 0; background: transparent; color: var(--pb-ink); cursor: pointer; font-size: 14px; padding: 0 2px; line-height: 1; }

/* size */
.size { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 16px; }
@media (max-width: 700px) { .size { grid-template-columns: minmax(0, 1fr); } }
.dims { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px 14px; align-content: start; }
.dims label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
.dims .field { font-variant-numeric: tabular-nums; font-size: 15px; }
.derived { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 14px; border-top: 1px dashed var(--line-2); padding-top: 12px; }
.derived div { font-size: 12.5px; color: var(--muted); }
.derived b { display: block; font-size: 15px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.plan svg { width: 100%; height: auto; display: block; max-width: 100%; }
.plan figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* option cards */
.cat { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cat-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
.cat-h h3 { margin: 0; font-size: 15.5px; font-weight: 600; }
.cat-h .cat-sum { font-weight: 600; font-variant-numeric: tabular-nums; }
.cat-qty { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 2px; }
.opt { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 3px; cursor: pointer; }
.opt:hover { background: var(--raise); }
.opt.on { background: var(--pb-soft); }
.opt input[type="radio"] { margin: 0; accent-color: var(--pb-ink); width: 16px; height: 16px; }
.opt label { cursor: pointer; font-size: 14px; min-width: 0; }
.opt.on label { font-weight: 600; }
.opt .zero { color: var(--muted); font-size: 13px; }
.ac-count { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; color: var(--ink-2); border-top: 1px dashed var(--line); padding-top: 8px; }

/* furniture */
.tierbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; color: var(--ink-2); }
.fgroup { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.fgroup + .fgroup { margin-top: 12px; }
.fgroup h3 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--ink-2); padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
.fgroup h3 span:last-child { font-variant-numeric: tabular-nums; color: var(--ink); }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) 118px 112px 150px 96px; gap: 10px; align-items: center; padding: 8px 14px; }
.frow + .frow { border-top: 1px dashed var(--line); }
.frow.zero .f-name, .frow.zero .f-sum { color: var(--muted); }
.f-name { font-size: 14px; min-width: 0; }
.f-sum { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

  function planSVG() {

    var x0 = (VW - w) / 2 + 6, y0 = (VH - h) / 2 - 4, out = '';
    out += '<rect x="' + x0 + '" y="' + y0 + '" width="' + w + '" height="' + h + '" style="fill:var(--pb-soft);stroke:var(--ink);stroke-width:3"/>';
    for (var gx = 3; gx < d.w - 0.01; gx += 3) out += '<line x1="' + (x0 + gx * s) + '" y1="' + y0 + '" x2="' + (x0 + gx * s) + '" y2="' + (y0 + h) + '" style="stroke:var(--ink-2);stroke-width:1;stroke-dasharray:4 4"/>';
    for (var gy = 6; gy < d.l - 0.01; gy += 6) out += '<line x1="' + x0 + '" y1="' + (y0 + gy * s) + '" x2="' + (x0 + w) + '" y2="' + (y0 + gy * s) + '" style="stroke:var(--ink-2);stroke-width:1;stroke-dasharray:4 4"/>';
    var n = Math.floor(d.w / 3 + 1e-9) * Math.floor(d.l / 6 + 1e-9);
    out += '<text x="' + (x0 + w / 2) + '" y="' + (y0 + h + 20) + '" text-anchor="middle" style="font-size:12px;fill:var(--ink-2);font-family:var(--f-mono)">' + nfmt(d.w, 1) + ' ' + U('m') + '</text>';

    if (n > 0) out += '<text x="' + (x0 + w / 2) + '" y="' + (y0 + h / 2 + 5) + '" text-anchor="middle" style="font-size:13px;font-weight:600;fill:var(--ink)">' + tf('modules', { n: n }) + '</text>';
    return '<svg viewBox="0 0 ' + VW + ' ' + VH + '" role="img" aria-label="' + esc(nfmt(d.w, 1) + ' × ' + nfmt(d.l, 1) + ' ' + U('m')) + '">' + out + '</svg>';

  var last = null;
  function recalc() {
    var r = compute(); last = r;
    var g = r.g;
    out('total', baht(r.total)); out('persqm', tf('perSqm', { v: baht(r.perSqm), a: nfmt(g.floor, 1) }));
    out('paid-total', baht(r.paid, true));
    out('g-floor', fq(g.floor, 'm2')); out('g-perim', fq(g.perim, 'm')); out('g-wall', fq(g.wallNet, 'm2')); out('g-btu', nfmt(g.btu) + ' BTU');
    var plan = document.getElementById('plan'); if (plan) plan.innerHTML = planSVG();
    ['shell', 'open', 'sys', 'furn', 'extra'].forEach(function (k) { out('grp-' + k, baht(r.by[k])); });
    r.lines.forEach(function (l) {
      if (l.kind === 'cat') {
        out('sum-' + l.c.id, baht(l.a));
        out('qty-' + l.c.id, l.q ? fq(l.q, l.u) + ' × ' + baht(l.p) : '—');
      } else if (l.kind === 'furn') {
        out('f-' + l.f.id, baht(l.a));
        var row = document.getElementById('frow-' + l.f.id); if (row) row.classList.toggle('zero', !l.q);
      } else if (l.kind === 'custom') {
        out('cu-' + l.cu.id, baht(l.a));
      }
    });
    FGROUPS.forEach(function (fg) { out('fg-' + fg.id, baht(r.lines.filter(function (l) { return l.kind === 'furn' && l.f.g === fg.id; }).reduce(function (s, l) { return s + l.a; }, 0))); });
    out('custom-total', baht(r.lines.filter(function (l) { return l.kind === 'custom'; }).reduce(function (s, l) { return s + l.a; }, 0)));
    var acO = CATS.filter(function (c) { return c.id === 'ac'; })[0].opts.filter(function (o) { return o.id === state.pick.ac; })[0];
    out('ac-rec', acO && acO.btu ? tf('acRec', { n: Math.ceil(g.btu / acO.btu), b: nfmt(g.btu) }) : '');
    var radios = document.querySelectorAll('[data-optrow]');
    for (var i = 0; i < radios.length; i++) { var inp = radios[i].querySelector('input[type="radio"]'); radios[i].classList.toggle('on', inp.checked); }
    var xr = document.querySelectorAll('[data-xrow]');
    for (var j = 0; j < xr.length; j++) xr[j].classList.toggle('off', !state.extras[xr[j].getAttribute('data-xrow')]);
    out('cont-pct', state.cont + '%');

    // stacked bar + legend
    var vals = { paid: r.paid, shell: r.by.shell, open: r.by.open, sys: r.by.sys, furn: r.by.furn, extra: r.by.extra, cont: r.cont };
    var bar = document.getElementById('bar'), legend = document.getElementById('legend');
    if (bar) {
      bar.innerHTML = ORDER.filter(function (k) { return vals[k] > 0; }).map(function (k) {
        var G = GROUPS[k], pct = r.total ? vals[k] / r.total * 100 : 0;
        return '<button type="button" class="seg' + (G.hatch ? ' hatch' : '') + '" role="listitem" data-seg="' + k + '" style="flex:' + vals[k] + ' 1 0;' + (G.hatch ? '' : 'background:var(' + G.c + ')') + '" aria-label="' + esc(L(G) + ' ' + baht(vals[k]) + ' (' + nfmt(pct, 1) + '%)') + '"></button>';
      }).join('');
      var lg = '';
      ORDER.forEach(function (k, idx) {
        var G = GROUPS[k], pct = r.total ? vals[k] / r.total * 100 : 0;
        var lbl = k === 'cont' ? L(G) + ' ' + state.cont + '%' : L(G);
        if (idx === 1) lg += '<div class="rule"></div>';
        lg += '<dt><span class="sw' + (G.hatch ? ' hatch' : '') + '" style="' + (G.hatch ? '' : 'background:var(' + G.c + ')') + '"></span><span>' + lbl + '</span></dt><dd>' + baht(vals[k], k === 'paid') + ' <span style="color:var(--muted);font-weight:400;font-size:12.5px">' + nfmt(pct, 0) + '%</span></dd>';
      });
      lg += '<div class="rule"></div><dt class="strong">' + t('toSpend') + '</dt><dd class="strong">' + baht(r.toSpend) + '</dd>';
      legend.innerHTML = lg;
    }
    var bs = document.querySelector('[data-out="budget-status"]');
    if (bs) {
      if (state.budget == null || !state.budget) bs.innerHTML = '';
      else { var diff = state.budget - r.total; bs.innerHTML = '<span class="status ' + (diff >= 0 ? 'ok' : 'no') + '">' + (diff >= 0 ? '✓ ' : '! ') + tf(diff >= 0 ? 'under' : 'over', { v: baht(Math.abs(diff)) }) + '</span>'; }
    }
    // year overview
    var P = projects(r);
    out('y-total', baht(P.total)); out('y-paid', baht(P.paid)); out('y-left', baht(P.left));
    out('y-count', tf('yCount', { n: P.rows.length, d: P.done }));
    P.rows.forEach(function (x) {
      out('pp-' + x.id, baht(x.paid)); out('pl-' + x.id, x.left ? baht(x.left) : '—'); out('pt-' + x.id, baht(x.total));
      var m = document.querySelector('[data-meter="' + x.id + '"]');
      if (m) {
        m.innerHTML = (x.paid > 0 ? '<span class="m-paid" style="flex:' + x.paid + ' 1 0"></span>' : '') + (x.left > 0 ? '<span class="m-left" style="flex:' + x.left + ' 1 0"></span>' : '');
        m.setAttribute('aria-label', t('colPaid') + ' ' + nfmt(x.total ? x.paid / x.total * 100 : 0) + '%');
      }
    });
    var ys = document.querySelector('[data-out="ybudget-status"]');
    if (ys) {
      if (!state.yearBudget) ys.innerHTML = '';
      else { var yd = state.yearBudget - P.total; ys.innerHTML = '<span class="status ' + (yd >= 0 ? 'ok' : 'no') + '">' + (yd >= 0 ? '✓ ' : '! ') + tf(yd >= 0 ? 'under' : 'over', { v: baht(Math.abs(yd)) }) + '</span>'; }
    }
    document.getElementById('mbar').innerHTML = '<div><div class="k">' + t('mTotal') + '</div><div class="v">' + baht(P.total) + '</div></div><div class="r">' + t('mPaid') + ' ' + baht(P.paid) + '<br>' + t('mLeft') + ' ' + baht(P.left) + '</div>';
  }

  var ref = null, mode = 'local', syncState = 'local', dirty = false, saveTimer = null, saving = false, again = false, retried = false, dl = null;
  var inViewer = !!(window.claude && typeof window.claude.use === 'function');

  }
  function persistLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function changed() {
    dirty = true; retried = false; persistLocal(); recalc();
    if (ref && mode === 'shared') { setSync('pending'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 900); }
  }
  function flush() {
    if (!ref || mode !== 'shared') return;
    if (saving) { again = true; return; }
    saving = true; setSync('saving');
    ref.set({ state: JSON.parse(JSON.stringify(state)), by: CLIENT, at: new Date().toISOString() }).then(function () {
      saving = false; retried = false;
      if (again) { again = false; flush(); return; }
      dirty = false; setSync('saved');
    }, function (e) {
      saving = false;
      if (e && e.code === 'invalid_argument') { mode = 'readonly'; setSync('readonly'); return; }
      if (e && e.code === 'unavailable' && !retried) { retried = true; setTimeout(flush, 800 + Math.random() * 800); return; }
      setSync('error');
    });
  }
  function connect() {
    if (!inViewer) return;
    window.claude.use('downloads').then(function (d) { dl = d; showCsv(); }, function () {});
    window.claude.use('db').then(function (db) {
      if (!db) return;
      var userP = window.claude.use('user').then(function (u) { return u ? u.can('data.write') : null; }, function () { return null; });
      userP.then(function (can) {
        ref = db.doc('plan/main');
        mode = can === false ? 'readonly' : 'shared';
        setSync(mode === 'shared' ? 'saved' : 'readonly');
        ref.onSnapshot(function (snap) {
          if (!snap.exists) { if (mode === 'shared' && dirty) flush(); return; }
          var d = snap.data();
          if (!d || !d.state || d.by === CLIENT) return;
          if (dirty && mode === 'shared') return;
          state = normalize(d.state); persistLocal(); render();
        }, function () { setSync('error'); });
      });
    }, function () {});
  }
  function showCsv() {
    var b = document.getElementById('csv');
    if (b) b.hidden = inViewer ? !dl : false;
  }

  /* ================= export ================= */
  function summaryText() {
    var r = last || compute(), P = projects(r), lines = [];
    lines.push(t('copyTitle') + ' · ' + fdate(todayISO()));
    P.rows.forEach(function (x) { lines.push('• ' + x.name + ' [' + t('st_' + x.s) + ']: ' + t('colPaid') + ' ' + baht(x.paid) + ' / ' + t('colLeft') + ' ' + baht(x.left) + ' / ' + t('tot') + ' ' + baht(x.total)); });
    lines.push(t('yTotal') + ' ' + baht(P.total) + ' · ' + t('yPaid') + ' ' + baht(P.paid) + ' · ' + t('yLeft') + ' ' + baht(P.left));
    if (state.yearBudget) { var yd = state.yearBudget - P.total; lines.push(t('yBudget') + ': ' + baht(state.yearBudget) + ' (' + tf(yd >= 0 ? 'under' : 'over', { v: baht(Math.abs(yd)) }) + ')'); }
    lines.push('');
    lines.push('== ' + t('officeName') + ' ==');
    lines.push(t('size') + ' ' + nfmt(state.dims.w, 1) + ' × ' + nfmt(state.dims.l, 1) + ' ' + U('m') + ' = ' + fq(r.g.floor, 'm2'));
    lines.push('');
    lines.push(L(GROUPS.paid) + ': ' + baht(r.paid, true));
    ['shell', 'open', 'sys', 'furn', 'extra'].forEach(function (k) { if (r.by[k]) lines.push(L(GROUPS[k]) + ': ' + baht(r.by[k])); });
    lines.push(L(GROUPS.cont) + ' ' + state.cont + '%: ' + baht(r.cont));
    lines.push('');
    lines.push(t('toSpend') + ': ' + baht(r.toSpend));
    lines.push(t('total') + ': ' + baht(r.total));
    if (state.budget) { var diff = state.budget - r.total; lines.push(t('budget') + ': ' + baht(state.budget) + ' (' + tf(diff >= 0 ? 'under' : 'over', { v: baht(Math.abs(diff)) }) + ')'); }
    lines.push('');
    CATS.forEach(function (c) { var l = r.lines.filter(function (x) { return x.c === c; })[0]; if (l && l.a) lines.push('• ' + L(c.name) + ': ' + L(l.o) + ' ' + baht(l.a)); });
    return lines.join('\n');
  }
  function csvText() {
    var r = last || compute(), P = projects(r), rows = [t('csvProjHead')];
    function q(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    P.rows.forEach(function (x) { rows.push([x.name, t('st_' + x.s), x.paid.toFixed(2), x.left.toFixed(2), x.total.toFixed(2)]); });
    rows.push([t('yTotal'), '', P.paid.toFixed(2), P.left.toFixed(2), P.total.toFixed(2)]);
    rows.push([]);
    rows.push(t('csvHead'));
    FLOOR.docs.forEach(function (d) { rows.push([L(FLOOR.name), L(VENDORS[d.v]) + ' ' + d.no, fdate(d.date), 1, U('lump', 1), d.total.toFixed(2), d.total.toFixed(2)]); });
    paidDocs().forEach(function (d) { rows.push([L(GROUPS.paid), d.mine ? d.n : L(VENDORS[d.v]) + ' ' + d.no, fdate(d.date), 1, U('lump', 1), d.total.toFixed(2), d.total.toFixed(2)]); });
    r.lines.forEach(function (l) {
      if (!l.a && l.kind !== 'cat') return;
      var name = l.kind === 'cat' ? L(l.c.name) : l.kind === 'furn' ? L(l.f) : l.kind === 'extra' ? L(l.x) : l.cu.n;
      var opt = l.kind === 'cat' ? L(l.o) : l.kind === 'furn' ? L(TIERS.filter(function (x) { return x.id === state.furn[l.f.id].t; })[0]) : '';
      rows.push([L(GROUPS[l.grp]), name, opt, r2(l.q), U(l.u, l.q), l.p, l.a.toFixed(2)]);
    });
    rows.push([L(GROUPS.cont) + ' ' + state.cont + '%', '', '', '', '', '', r.cont.toFixed(2)]);
    rows.push([t('total'), '', '', '', '', '', r.total.toFixed(2)]);
    return '﻿' + rows.map(function (row) { return row.map(q).join(','); }).join('\r\n');
  }
  function toast(msg) { var el = document.getElementById('toast'); if (el) { el.textContent = msg; clearTimeout(toast.t); toast.t = setTimeout(function () { el.textContent = ''; }, 4000); } }

  /* ================= events ================= */
  function num(v) { var n = parseFloat(v); return isFinite(n) ? n : null; }

  document.addEventListener('input', function (e) {
    var el = e.target, ds = el.dataset || {};
    if (ds.price) { var v = num(el.value); if (v == null || v < 0) return; state.price[ds.price] = v; el.classList.toggle('edited', v !== +ds.def); var u = el.parentNode.querySelector('.undo'); if (u) u.hidden = v === +ds.def; changed(); return; }
    if (ds.dim) {
      if (ds.dim === 'ac') { var a = num(el.value); state.dims.ac = a == null ? null : Math.max(0, Math.round(a)); changed(); return; }
      var d = num(el.value); if (d == null) return;
      var lim = { w: [1, 200], l: [1, 200], h: [2, 10], part: [0, 500], win: [0, 200], door: [0, 50], idoor: [0, 100] }[ds.dim];
      if (d < lim[0] || d > lim[1]) return;
      state.dims[ds.dim] = ['win', 'door', 'idoor'].indexOf(ds.dim) >= 0 ? Math.round(d) : d; changed(); return;
    }
    if (ds.fq) { var fqv = num(el.value); if (fqv == null) return; state.furn[ds.fq].q = Math.max(0, Math.round(fqv)); changed(); return; }
    if (ds.cu) {
      var cu = state.custom.filter(function (x) { return x.id === ds.cu; })[0]; if (!cu) return;
      if (ds.f === 'n') cu.n = el.value.slice(0, 120);
      else if (ds.f === 'q' || ds.f === 'p') { var cv = num(el.value); if (cv == null || cv < 0) return; cu[ds.f] = cv; }
      changed(); return;
    }
    if (el.id === 'budget') { var b = num(el.value); state.budget = b == null ? null : Math.max(0, b); changed(); return; }
    if (el.id === 'ybudget') { var yb = num(el.value); state.yearBudget = yb == null ? null : Math.max(0, yb); changed(); return; }
    if (ds.pj) {
      var pj = state.projects.filter(function (x) { return x.id === ds.pj; })[0]; if (!pj) return;
      if (ds.f === 'n') pj.n = el.value.slice(0, 120);
      else if (ds.f === 'paid' || ds.f === 'est') { var pv = num(el.value); if (pv == null || pv < 0) return; pj[ds.f] = pv; }
      else return;
      changed(); return;
    }
    if (el.id === 'cont') { state.cont = Math.round(+el.value); changed(); return; }
  });

  document.addEventListener('change', function (e) {
    var el = e.target, ds = el.dataset || {};
    if (ds.pick) { state.pick[ds.pick] = el.value; changed(); return; }
    if (ds.ex) { state.extras[ds.ex] = el.checked; changed(); return; }
    if (ds.ft) { state.furn[ds.ft].t = el.value; changed(); render(); return; }
    if (ds.ostatus) { state.officeStatus = el.value; changed(); render(); return; }
    if (ds.pj && ds.f === 's') { var ps = state.projects.filter(function (x) { return x.id === ds.pj; })[0]; if (ps) { ps.s = el.value; changed(); render(); } return; }
    if (ds.cu && ds.f === 'g') { var cu = state.custom.filter(function (x) { return x.id === ds.cu; })[0]; if (cu) { cu.g = el.value; changed(); } return; }
    if (ds.price && el.value === '') { delete state.price[ds.price]; changed(); render(); return; }
    if (ds.dim && ds.dim !== 'ac' && num(el.value) == null) { el.value = state.dims[ds.dim]; return; }
    if (ds.fq && num(el.value) == null) { el.value = state.furn[ds.fq].q; return; }
  });

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('button, [data-optrow], [data-xrow]') : null;
    if (!el) return;
    var ds = el.dataset;
    if (ds.lang) { lang = ds.lang; try { localStorage.setItem(LANGKEY, lang); } catch (x) {} render(); return; }
    if (ds.optrow && e.target.tagName !== 'INPUT' && e.target.tagName !== 'LABEL' && e.target.tagName !== 'BUTTON') { var r = el.querySelector('input[type="radio"]'); if (r && !r.checked) { r.checked = true; state.pick[ds.optrow] = r.value; changed(); } return; }
    if (ds.xrow && e.target.tagName !== 'INPUT' && e.target.tagName !== 'LABEL' && e.target.tagName !== 'BUTTON') { var c = el.querySelector('input[type="checkbox"]'); if (c) { c.checked = !c.checked; state.extras[ds.xrow] = c.checked; changed(); } return; }
    if (ds.unprice) { delete state.price[ds.unprice]; changed(); render(); return; }
    if (ds.step) { var f = state.furn[ds.step]; f.q = Math.max(0, f.q + (+ds.d)); var inp = document.getElementById('fq-' + ds.step); if (inp) inp.value = f.q; changed(); return; }
    if (ds.alltier) { FURN.forEach(function (x) { state.furn[x.id].t = ds.alltier; }); changed(); render(); return; }
    if (ds.addpj) { var pid = uid(); state.projects.push({ id: pid, n: '', s: 'plan', est: 0, paid: 0 }); changed(); render(); var pn = document.getElementById('pjn-' + pid); if (pn) pn.focus(); return; }
    if (ds.delpj) { state.projects = state.projects.filter(function (x) { return x.id !== ds.delpj; }); changed(); render(); return; }
    if (ds.goto) { var tg = document.getElementById(ds.goto); if (tg) tg.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); return; }
    if (ds.addcu) { var id = uid(); state.custom.push({ id: id, n: '', g: 'extra', q: 1, p: 0 }); changed(); render(); var n = document.getElementById('cn-' + id); if (n) n.focus(); return; }
    if (ds.delcu) { state.custom = state.custom.filter(function (x) { return x.id !== ds.delcu; }); changed(); render(); return; }
    if (ds.delpay) { state.paidExtra = state.paidExtra.filter(function (x) { return x.id !== ds.delpay; }); delete openDocs[ds.delpay]; changed(); render(); return; }
    if (el.id === 'copy') {
      var txt = summaryText(), fb = document.getElementById('copy-fb');
      var fail = function () { fb.value = txt; fb.hidden = false; fb.focus(); fb.select(); toast(t('copyFail')); };
      try { navigator.clipboard.writeText(txt).then(function () { fb.hidden = true; toast(t('copied')); }, fail); } catch (x) { fail(); }
      return;
    }
    if (el.id === 'csv') {
      var data = csvText(), fname = 'right-bite-office-budget-' + todayISO() + '.csv';
      if (dl) { dl.save({ filename: fname, data: data }).then(function (res) { toast(t('csvDone')); }, function () { toast(t('csvFail')); }); }
      else if (!inViewer) { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8' })); a.download = fname; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
      return;
    }
    if (el.id === 'reset') { resetArmed = true; document.getElementById('reset-wrap').innerHTML = resetHTML(); var y = document.getElementById('reset-no'); if (y) y.focus(); clearTimeout(resetTimer); resetTimer = setTimeout(function () { resetArmed = false; var w = document.getElementById('reset-wrap'); if (w) w.innerHTML = resetHTML(); }, 8000); return; }
    if (el.id === 'reset-no') { resetArmed = false; document.getElementById('reset-wrap').innerHTML = resetHTML(); return; }
    if (el.id === 'reset-yes') { resetArmed = false; var keep = state; state = defaults(); state.paidExtra = keep.paidExtra; state.projects = keep.projects; state.officeStatus = keep.officeStatus; state.yearBudget = keep.yearBudget; changed(); render(); return; }
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'addpay') return;
    e.preventDefault();
    var n = document.getElementById('pay-n').value.trim(), a = num(document.getElementById('pay-a').value);
    var d = document.getElementById('pay-d').value, c = document.getElementById('pay-c').value;
    if (!n || a == null || a <= 0) { document.getElementById('pay-msg').textContent = t('needAmt'); return; }
    state.paidExtra.push({ id: uid(), d: /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : todayISO(), n: n.slice(0, 160), c: PAIDCAT[c] ? c : 'other', a: a });
    changed(); render();
  });

  document.addEventListener('toggle', function (e) {
    var el = e.target; if (el.dataset && el.dataset.doc) { if (el.open) openDocs[el.dataset.doc] = true; else delete openDocs[el.dataset.doc]; }
  }, true);

  // bar tooltip
  function showTip(seg) {
    var tip = document.getElementById('tip'), wrap = seg.parentNode.parentNode;
    if (!tip || !last) return;
    var k = seg.dataset.seg, vals = { paid: last.paid, shell: last.by.shell, open: last.by.open, sys: last.by.sys, furn: last.by.furn, extra: last.by.extra, cont: last.cont };
    tip.innerHTML = '<b>' + esc(L(GROUPS[k])) + '</b> ' + baht(vals[k], k === 'paid') + ' · ' + nfmt(last.total ? vals[k] / last.total * 100 : 0, 1) + '%';
    tip.hidden = false;
    var wr = wrap.getBoundingClientRect(), sr = seg.getBoundingClientRect(), tw = tip.offsetWidth;
    var x = sr.left - wr.left + sr.width / 2; x = Math.max(tw / 2, Math.min(wr.width - tw / 2, x));
    tip.style.left = x + 'px';
  }
  function hideTip() { var tip = document.getElementById('tip'); if (tip) tip.hidden = true; }
  document.addEventListener('pointerover', function (e) { var s = e.target.closest && e.target.closest('[data-seg]'); if (s) showTip(s); else if (!(e.target.closest && e.target.closest('.bar'))) hideTip(); });
  document.addEventListener('focusin', function (e) { if (e.target.dataset && e.target.dataset.seg) showTip(e.target); else hideTip(); });

  render();
  connect();
})();
